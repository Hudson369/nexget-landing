<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>در حال انتقال به درگاه پرداخت...</title>
    <style>
        body {
            background-color: #12161A;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #00F0FF;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h3>در حال اتصال به درگاه پرداخت امن...</h3>
        <p>لطفاً چند لحظه صبر کنید...</p>
    </div>

    <script>
        async function startPayment() {
            const urlParams = new URLSearchParams(window.location.search);
            const phone = urlParams.get('phone');
            const fingerprint = urlParams.get('fingerprint');

            if (!phone || !fingerprint) {
                alert('اطلاعات پرداخت ناقص است.');
                return;
            }

            try {
                // آدرس سرور پایتون خودت را اینجا بگذار (مثلا آی پی سرور یا دامنه بک‌اند)
                const response = await fetch('http://82.115.24.70:8000/payment/request', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-secret-key': 'NexGet_Secure_Secret_Key_2026_AmirHossein'
                    },
                    body: JSON.stringify({
                        phone: phone,
                        fingerprint: fingerprint,
                        amount: 690000
                    })
                });
                const data = await response.json();

                if (data.success && data.payment_url) {
                    // هدایت کاربر به درگاه زرین‌پال با ساب‌دامنه اختصاصی
                    window.location.href = data.payment_url;
                } else {
                    alert('خطا در ایجاد تراکنش: ' + (data.error || 'ناشناخته'));
                }
            } catch (err) {
                alert('خطا در ارتباط با سرور پرداخت.');
                console.error(err);
            }
        }

        startPayment();
    </script>
</body>
</html>
