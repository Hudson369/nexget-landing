
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F1319">
  <title>You're Invited to NexGet</title>
  <meta name="description" content="Join NexGet Community and discover what's trending.">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(0,229,255,.12), transparent 55%),
        #0F1319;
      color: #F4F7FA;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 42px 28px;
      text-align: center;
      background: #1A1F24;
      border: 1px solid rgba(0,229,255,.16);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 38px;
    }

    .logo span { color: #00E5FF; }

    .icon {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      border-radius: 22px;
      background: rgba(0,229,255,.1);
      color: #00E5FF;
      font-size: 34px;
    }

    h1 {
      font-size: 27px;
      margin: 0 0 14px;
    }

    .description {
      color: #A8B0BA;
      line-height: 1.8;
      font-size: 15px;
      margin: 0 auto 28px;
    }

    .code-box {
      padding: 17px;
      margin: 24px 0;
      border: 1px dashed rgba(0,229,255,.45);
      border-radius: 14px;
      background: rgba(0,229,255,.05);
    }

    .code-label {
      color: #89939E;
      font-size: 12px;
      margin-bottom: 9px;
    }

    #referralCode {
      color: #00E5FF;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 3px;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-block;
      padding: 9px 14px;
      border-radius: 30px;
      color: #00E5FF;
      background: rgba(0,229,255,.09);
      font-size: 12px;
      margin-top: 8px;
    }

    .footer {
      margin-top: 30px;
      color: #66717D;
      font-size: 12px;
    }

    .error { color: #FF7777; }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">NEX<span>GET</span></div>

    <div class="icon">✦</div>

    <h1>You're Invited!</h1>

    <p class="description">
      Join NexGet Community, discover amazing content,
      connect with others and earn XP as you participate.
    </p>

    <div class="code-box" id="codeBox">
      <div class="code-label">YOUR INVITATION CODE</div>
      <div id="referralCode">Loading...</div>
    </div>

    <div class="status">NexGet is coming soon</div>

    <p class="footer">
      Discover more. Connect more. Level up.
      <br><br>
      © NexGet
    </p>
  </main>

  <script>
    function getReferralCode() {
      const params = new URLSearchParams(window.location.search);
      const queryCode = params.get("code");

      if (queryCode) return queryCode;

      const parts = window.location.pathname
        .split("/")
        .filter(Boolean);

      if (parts.length >= 2 && parts[0] === "invite") {
        return decodeURIComponent(parts[1]);
      }

      return null;
    }

    const code = getReferralCode();
    const codeElement = document.getElementById("referralCode");

    if (code) {
      codeElement.textContent = code.toUpperCase();
    } else {
      codeElement.textContent = "Invalid invitation";
      codeElement.classList.add("error");
    }
  </script>
</body>
</html>
